<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a12"><title>NovaPulse Admin</title><link rel="stylesheet" href="/styles.css"><style>.admin-wrap{width:min(680px,calc(100% - 32px));margin:9vh auto}.admin-wrap h1{font:500 36px var(--display);letter-spacing:-1.4px}.admin-wrap p{font-size:12px;color:var(--muted);line-height:1.7}.admin-form{display:flex;gap:9px;margin:22px 0}.admin-form input{min-width:0;flex:1;background:#111523;border:1px solid var(--line);border-radius:8px;padding:12px;color:white;outline:0}.admin-form button{border:0;border-radius:8px;padding:0 17px;background:linear-gradient(110deg,#a895ff,#6d82ef);color:white}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);border-radius:11px;padding:18px;background:#101320}.stat small,.stat strong{display:block}.stat small{color:#858ba5;font-size:10px;margin-bottom:10px}.stat strong{font-size:15px}.back{font-size:11px;color:#b8adff}</style></head><body><div class="ambient ambient-a"></div><main class="admin-wrap"><a class="back" href="/">← Back to workspace</a><div class="eyebrow" style="margin-top:35px">WORKSPACE CONTROL</div><h1>Admin console</h1><p>Starter diagnostics for your NovaPulse deployment. Set a strong <code>ADMIN_PASSWORD</code> in Railway Variables before using this page.</p><form class="admin-form" id="adminForm"><input type="password" id="adminPassword" placeholder="Admin password" autocomplete="current-password" required><button>Unlock console ↗</button></form><div id="result" class="stats"></div><p id="error" style="color:#ff9baf"></p><script>document.getElementById("adminForm").addEventListener("submit",async e=>{e.preventDefault();document.getElementById("error").textContent="";document.getElementById("result").innerHTML="";try{const r=await fetch("/api/admin/stats",{headers:{"x-admin-password":document.getElementById("adminPassword").value}});const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not unlock.");Object.entries(d).forEach(([k,v])=>{const card=document.createElement("div");card.className="stat";const small=document.createElement("small");small.textContent=k.replace(/[A-Z]/g,m=>" "+m).toUpperCase();const strong=document.createElement("strong");strong.textContent=String(v);card.append(small,strong);document.getElementById("result").append(card)})}catch(err){document.getElementById("error").textContent=err.message}})</script></main></body></html>
